function shell(content,active=''){return `<div class="status"><span>9:41</span><span class="status-right">▮▮▮ 5G <span class="battery">89</span></span></div><div class="scroll">${content}</div>${active?bottom(active):''}`}
function bottom(active){return `<nav class="bottom" aria-label="主导航">${[['home','遇见','home'],['matches','速配','video'],['messages','消息','message'],['mine','我','user']].map(([s,n,i])=>`<button class="${active===s?'active':''}" onclick="go('${s}')"><span class="nav-icon">${icon(i)}</span>${n}${s==='messages'?'<span class="badge">2</span>':''}</button>`).join('')}</nav>`}
function inner(title,right=''){return `<div class="inner-head"><button class="back" onclick="back()" aria-label="返回">${icon('back')}</button><h1>${title}</h1>${right}</div>`}
function tags(p){return p.tags.map(t=>`<span class="tag ${t==='在线'?'green':t==='已认证'?'gold':'pink'}">${t}</span>`).join('')}
function personCard(p){return `<article class="feed-card" onclick="go('detail',{person:${p.id},from:'home'})" role="button" tabindex="0"><div class="avatar-wrap"><img class="avatar" src="${photo(p.photo)}" alt="${p.name}的示意头像"><span class="online-dot"></span></div><div class="feed-main"><div class="feed-top"><span class="feed-name">${p.name}</span>${tags(p)}<button class="say-hi" onclick="event.stopPropagation();go('chat',{person:${p.id},from:'home'})">打招呼</button></div><p class="feed-meta">${p.age} 岁 · ${p.area} · ${p.job} · ${p.edu}</p><p class="feed-soft">♧ 认真交友 · 期待稳定关系</p><p class="feed-bio">${p.bio}</p>${p.id%3===1?`<div class="photo-strip"><img src="${photo(p.photo)}" alt="生活照"><img src="${photo(p.photo)}" alt="生活照"><img src="${photo(p.photo)}" alt="生活照"></div>`:''}</div></article>`}
function renderMessages(){const rows=[['heart','看看谁喜欢我','你有新的心动消息，快去看看','likes','pink'],['pin','附近的人','发现一批距离很近的人','home',''],['eye','最近访客','小满刚刚看了你的主页','visitors','mint'],['bell','系统消息','欢迎来到遇见你，完善资料更容易被发现','notifications',''],['phone','连线记录','查看语音、视频时长与消费账单','calls','pink'],['spark','互动通知','阿宁赞了你的动态','notifications','']];return shell(`<div class="topwash"><div class="head"><h1 class="page-title">消息</h1><div class="group"><button class="icon-btn" onclick="showToast('搜索功能展示中')" aria-label="搜索">${icon('search')}</button><button class="mini-btn" onclick="go('filter',{from:'messages'})">筛选</button></div></div><div class="stories">${[null,people[0],people[2],people[4],people[6]].map((p,i)=>`<button class="story" onclick="${p?`go('chat',{person:${p.id},from:'messages'})`:`go('room',{from:'messages'})`}">${p?`<img src="${photo(p.photo)}" alt="">`:'<span class="story-icon">♧</span>'}<span>${p?p.name:'我的小队'}</span></button>`).join('')}</div></div><div class="messages-list">${rows.map(([ic,title,desc,target,color],i)=>`<button class="msg-row" onclick="go('${target}',{from:'messages'})"><span class="msg-icon ${color}">${icon(ic)}</span><span class="msg-body"><b>${title}</b><small>${desc}</small></span>${i===2?'<span class="unread">2</span>':`<span class="msg-time">${i===0?'刚刚':'昨天'}</span>`}</button>`).join('')}<div class="section-head" style="padding-left:0"><h2>私信聊天</h2><span>最近联系</span></div>${people.slice(0,2).map(p=>`<button class="msg-row" onclick="go('chat',{person:${p.id},from:'messages'})"><img class="avatar" style="width:51px;height:51px" src="${photo(p.photo)}" alt=""><span class="msg-body"><b>${p.name}</b><small>${p.id===1?'周末有个摄影展，一起去看看？':'你好，很高兴认识你'}</small></span><span class="msg-time">09:41</span></button>`).join('')}</div>`,'messages')}

function endCall(reason='通话已结束'){if(P.call)closeCallState(reason);else P.summary={type:S.screen==='voice'?'voice':'video',seconds:0,charged:0,rate:rate(S.screen==='voice'?'voice':'video'),minutes:0,person:S.person,reason:'画面预览结束 · 未计费'};go('summary')}
function renderCalling(){const p=currentPerson(),type=P.call?.type||S.callType||'video';return status()+`<div class="call-view voice-mode"><div class="call-top"><strong>${modeName(type)}通话邀请</strong><span class="demo-label">等待接通 · 未计费</span></div><div class="call-person"><img class="ring-pulse" src="${photo(p.photo)}" alt="${p.name}"><h1>${p.name}</h1><p>正在邀请对方${modeName(type)}聊天…</p></div><div class="call-meter">接通后 ${rate(type)} 金币/分钟</div><div class="call-preview-actions"><button onclick="connectCall()">模拟对方接听</button></div><div class="call-preview-actions"><button onclick="endCall('对方暂未接听 · 未扣费')">模拟无人接听</button></div><div class="call-controls"><button class="hangup" onclick="endCall('已取消呼叫 · 未扣费')">${icon('phone')}取消呼叫</button><div class="call-hint">这是等待接通的界面演示</div></div></div>`}
function renderLiveCall(type){const p=currentPerson(),c=P.call,active=c?.phase==='active',time=c?.seconds||0;return status()+`<div class="call-view ${type==='video'?'video-mode':'voice-mode'}">${type==='video'?`<img class="video-scene" src="${photo(p.photo)}" alt="视频通话场景示意"><div class="scene-shade"></div>`:''}<div class="call-top"><div><strong>${p.name}</strong><div style="font-size:10px;color:#ded5c8;margin-top:4px">${modeName(type)}通话 · ${active?'演示已接通':'画面预览'}</div></div><span class="demo-label">示意画面</span></div>${type==='video'?`<div class="call-pip">${P.camera?`<img src="${photo(9)}" style="transform:${P.flipped?'scaleX(-1)':'none'}" alt="本地画面示意">`:'<div class="camera-off">摄像头已关</div>'}<span>${P.flipped?'后置示意':'我的画面'}</span></div><div class="call-video-bottom">`:`<div class="call-person"><img src="${photo(p.photo)}" alt="${p.name}"><h1>${p.name}</h1><p>${P.muted?'麦克风已静音':'正在用声音，拉近一点距离'}</p></div>`}<div class="call-clock" data-call-time>${timeText(time)}</div><div class="call-meter" data-call-fee>${rate(type)}币/分钟 · 已扣 ${c?.charged||0} 币 · 余额 ${P.balance} 币</div>${type==='video'?'</div>':''}${!active?'<div class="call-preview-actions"><button onclick="connectCall()">开始计费演示</button></div>':''}<div class="call-controls"><div class="call-aux"><button class="call-tool ${P.muted?'active':''}" onclick="P.muted=!P.muted;render()"><i>${icon('mic')}</i>${P.muted?'取消静音':'静音'}</button>${type==='video'?`<button class="call-tool ${!P.camera?'active':''}" onclick="P.camera=!P.camera;render()"><i>${icon('video')}</i>${P.camera?'关摄像头':'开摄像头'}</button><button class="call-tool" onclick="P.flipped=!P.flipped;render()"><i>${icon('flip')}</i>翻转</button>`:`<button class="call-tool ${P.speaker?'active':''}" onclick="P.speaker=!P.speaker;render()"><i>${icon('speaker')}</i>${P.speaker?'扬声器':'听筒'}</button>`}<button class="call-tool" onclick="openModal('gifts')"><i>${icon('gift')}</i>礼物</button></div><button class="hangup" onclick="endCall()">${icon('phone')}结束通话</button><div class="call-hint">${active?'正在演示计时与金币扣除':'未连接真实通话 · 预览不扣金币'}</div></div></div>`}
function renderSummary(){const c=P.summary||{type:'video',seconds:135,rate:120,charged:360,minutes:3,person:S.person,reason:'通话账单示例'},p=people.find(x=>x.id===c.person)||currentPerson();return paidPage('通话账单',`<div class="success-disc">${icon('check')}</div><div class="summary-title"><h2>${c.reason}</h2><p>与 ${p.name} 的${modeName(c.type)}聊天</p></div><div class="bill-grid"><div class="bill-row"><span>通话时长</span><strong>${timeText(c.seconds)}</strong></div><div class="bill-row"><span>计费单价</span><strong>${c.rate} 币/分钟</strong></div><div class="bill-row"><span>计费分钟数</span><strong>${c.minutes} 分钟</strong></div><div class="bill-row"><span>本次通话扣费</span><strong>${c.charged} 金币</strong></div><div class="bill-row"><span>当前余额</span><strong>${P.balance} 金币</strong></div></div><p class="fee-note">礼物费用单独记录。可在金币收支明细中查看每笔消费。</p><div class="double-actions"><button onclick="go('bills')">查看明细</button><button class="primary" onclick="go('chat')">继续私信</button></div><button class="full-btn" style="background:#fff2ce" onclick="requestCall('${c.type}')">再次拨打</button>`)}
function renderWallet(){return paidPage('我的金币',`<div class="balance-hero"><small>可用金币</small><h2>${P.balance} <span style="font-size:22px">◈</span></h2><p>用于私信、语音、视频通话与礼物</p></div><div class="double-actions"><button class="primary" onclick="go('recharge')">充值金币</button><button onclick="go('bills')">收支明细</button></div><h3 style="font-size:15px;margin-top:26px">金币怎么用</h3><div class="bill-grid"><div class="bill-row"><span>私信聊天</span><strong>5 币 / 条</strong></div><div class="bill-row"><span>语音通话</span><strong>60 币 / 分钟</strong></div><div class="bill-row"><span>视频通话</span><strong>120 币 / 分钟</strong></div><div class="bill-row"><span>虚拟礼物</span><strong>按礼物标价扣费</strong></div></div><p class="fee-note">以上为原型示例费率。金币用于消费，接听收益在“我的收益”中单独查看。</p><button class="full-btn" style="background:#f4eee1" onclick="go('earnings')">查看我的收益</button>`)}
function renderRecharge(){return paidPage('充值金币',`<div class="balance-hero"><small>当前余额</small><h2>${P.balance} <span style="font-size:20px">金币</span></h2><p>充值后可继续私信与音视频聊天</p></div><h3 style="font-size:15px">选择充值金额</h3><div class="credit-grid">${packs.map((p,i)=>`<button class="credit-pack ${P.pack===i?'selected':''}" onclick="P.pack=${i};render()"><strong>${p.coins}</strong><small>金币</small><b>¥ ${p.yuan}</b></button>`).join('')}</div><div class="bill-grid"><div class="bill-row"><span>充值方式</span><strong>模拟支付</strong></div><div class="bill-row"><span>本次到账</span><strong>${packs[P.pack].coins} 金币</strong></div></div><p class="fee-note">示例兑换比例 1 元 = 10 金币。点击下方按钮只增加本次演示余额，不扣除真实资金。</p>`,`<button class="full-btn" onclick="topUp()">模拟支付 ¥${packs[P.pack].yuan} · 充值 ${packs[P.pack].coins} 金币</button>`)}
function topUp(){const p=packs[P.pack];P.balance+=p.coins;P.ledger.unshift({label:'金币充值（模拟）',amount:p.coins,type:'充值',time:stamp()});const pending=P.pending;P.pending=null;if(pending)go(pending);else go('wallet');showToast(`模拟充值成功 · +${p.coins} 金币`)}
function giftChoices(){return `<div class="gift-grid">${gifts.map((g,i)=>`<button class="gift-item ${P.gift===i?'selected':''}" onclick="P.gift=${i};${P.modal?'renderModal()':'render()'}"><span>${g.emoji}</span><b>${g.name}</b><small>${g.cost} 金币</small></button>`).join('')}</div>`}
function renderGifts(){return paidPage('给 TA 送礼物',`<div class="compact-person"><img class="avatar" src="${photo(currentPerson().photo)}" alt=""><div><h2>${currentPerson().name}</h2><p>送一份小心意，表达此刻的心情</p></div></div>${giftChoices()}<p class="fee-note">可用余额 ${P.balance} 金币 · 礼物不与通话费用合并</p>`,`<button class="full-btn" onclick="sendGift()">赠送${gifts[P.gift].name} · ${gifts[P.gift].cost} 金币</button>`)}
function sendGift(){const g=gifts[P.gift];if(!charge(g.cost,`礼物 · ${g.name}`)){lowBalance(g.cost,P.call?null:'gifts');return}appendMessage(`送出 ${g.emoji} ${g.name}`);closeModal();render();showToast(`已赠送${g.name} · 扣除 ${g.cost} 金币（演示）`)}
function renderBills(){const rows=P.ledger.filter(r=>P.billTab==='全部'||r.type===P.billTab);return paidPage('金币收支明细',`<div class="paid-tabs" style="padding:0 0 10px">${['全部','充值','消费'].map(t=>`<button class="${P.billTab===t?'selected':''}" onclick="P.billTab='${t}';render()">${t}</button>`).join('')}</div><p class="fee-note">当前余额 ${P.balance} 金币 · 本次演示记录</p>${rows.length?rows.map(r=>`<div class="record-line"><i class="record-icon">${icon(r.type==='充值'?'wallet':'message')}</i><div><b>${escapeHtml(r.label)}</b><small>今天 ${r.time} · ${r.type}</small></div><strong>${r.amount>0?'+':''}${r.amount}</strong></div>`).join(''):'<div class="empty"><b>暂时没有金币记录</b>聊天、通话或模拟充值后会显示在这里</div>'}`)}
function renderCalls(){return paidPage('通话记录',P.calls.length?P.calls.map((c,i)=>`<div class="mini-profile"><img src="${photo(people.find(p=>p.id===c.person).photo)}" alt=""><div><b>${people.find(p=>p.id===c.person).name} · ${modeName(c.type)}通话</b><small>${c.time} · ${timeText(c.seconds)} · ${c.charged} 金币</small></div><button onclick="P.summary=P.calls[${i}];go('summary')">账单</button></div>`).join(''):'<div class="empty"><b>还没有通话记录</b>完成一次语音或视频演示，账单会保存在这里。<button class="full-btn" onclick="go(\'home\')">去认识新朋友</button></div>')}
function renderEarnings(){return paidPage('我的收益',`<span class="demo-label">接听方视角 · 示例收益</span><div class="balance-hero" style="margin-top:12px"><small>可提现收益豆</small><h2>${P.earning.toLocaleString()}</h2><p>约 ¥${(P.earning/100).toFixed(2)} · 示例兑换比例</p></div><div class="earnings-stats"><div><b>860</b><small>今日收益豆</small></div><div><b>7</b><small>今日接通次数</small></div><div><b>42</b><small>今日通话分钟</small></div></div><div class="double-actions"><button class="primary" onclick="go('withdraw')">申请提现</button><button onclick="go('pricing')">接听与定价</button></div><h3 style="font-size:15px;margin-top:24px">收益构成（示例）</h3>${[['语音通话收益','+360'],['视频通话收益','+420'],['礼物收益','+80']].map(([a,b])=>`<div class="record-line"><i class="record-icon">${icon('wallet')}</i><div><b>${a}</b><small>今天 · 结算展示</small></div><strong>${b}</strong></div>`).join('')}<p class="fee-note">消费金币与收益豆分别记账。实际分成比例、结算周期和提现门槛需由业务方确认。</p>`)}
function renderPricing(){return paidPage('接听与收费设置',`<div class="notice-card" style="background:#fff8df"><b>让想聊天的人看到你</b><p>开启接听后，主页展示可接听状态。此页演示接听方的价格管理。</p></div><button class="setting-row" onclick="P.availability=!P.availability;render()"><span>在线接听</span><i class="toggle ${P.availability?'on':''}"></i></button>${[['text','私信单价',[0,5,10,20],'币/条'],['voice','语音单价',[30,60,90,120],'币/分钟'],['video','视频单价',[60,120,180,240],'币/分钟']].map(([k,l,vals,u])=>`<div class="pricing-line"><label>${l}<small style="color:#b6a582">${u}</small></label><select aria-label="${l}" onchange="P.rateDraft.${k}=Number(this.value)">${vals.map(v=>`<option value="${v}" ${v===P.rateDraft[k]?'selected':''}>${v} ${u}</option>`).join('')}</select></div>`).join('')}<p class="fee-note">保存后更新自己的收费方案；其他用户的单价各自独立。实际价格范围与开放资格需按业务规则配置。</p>`,`<button class="full-btn" onclick="P.rateSaved={...P.rateDraft};showToast('自己的收费方案已保存（演示）')">保存接听与价格设置</button>`)}
function renderWithdraw(){return paidPage('收益提现',`<div class="balance-hero"><small>可提现金额（示例）</small><h2>¥ ${(P.earning/100).toFixed(2)}</h2><p>${P.earning} 收益豆 · 100 豆 = 1 元（示例）</p></div>${P.withdrawn?'<div class="notice-card"><b>模拟申请已提交 · 待审核</b><p>提现金额 ¥50.00。本次仅展示申请状态，不会实际转账。</p></div>':`<div class="bill-grid"><div class="bill-row"><span>本次申请金额</span><strong>¥50.00</strong></div><div class="bill-row"><span>收款账户</span><strong>演示账户 · 尾号 8611</strong></div><div class="bill-row"><span>实名认证</span><strong>${P.verified?'演示校验已完成':'待校验'}</strong></div></div><p class="fee-note">当前以 50 元作为示例提现档位。真实产品需核验实名与收款账户，实际到账时间和手续费应由平台明确。</p><button class="full-btn" onclick="if(!P.verified){go('verify');return}if(P.earning<5000){showToast('可提现余额不足');return}P.earning-=5000;P.withdrawn=true;render()">${P.verified?'提交模拟提现申请':'先完成实名校验'}</button>`}`)}
function renderVerify(){return paidPage('实名认证',`<div class="success-disc">${icon('shield')}</div><div class="summary-title"><h2>${P.verified?'演示校验已完成':P.verifyPending?'资料审核中':'真实身份，安心交流'}</h2><p>开通接听与提现前完成身份校验</p></div>${[['1','核对身份信息','姓名与证件信息一致'],['2','真人活体检测','按提示完成动作校验'],['3','等待审核结果','审核通过后开通对应权限']].map(([n,t,d])=>`<div class="verify-stage"><i>${n}</i><div><b>${t}</b><p>${d}</p></div></div>`).join('')}<p class="fee-note">这里演示认证流程与状态，不采集真实证件或摄像头画面。</p><button class="full-btn" onclick="${P.verified?`go('withdraw')`:P.verifyPending?`P.verified=true;render()`:`P.verifyPending=true;render()`}">${P.verified?'前往提现':P.verifyPending?'模拟审核通过':'开始模拟认证'}</button>`)}
function renderMine(){return shell(`<div class="mine-bg"><div class="mine-hero"><img src="${photo(9)}" alt="我的头像"><div><div class="mine-name">${escapeHtml(S.profile.name)} <span class="vip">VIP</span></div><div class="mine-id">ID：177362632 · 资料完善度 85%</div><div class="level">◆ 魅力等级 24</div></div><button class="mini-btn" onclick="go('edit')">编辑</button></div><div class="mine-stats">${[['2','我关注的','visitors'],['1','好友','visitors'],['112','关注我的','likes'],['99+','访客','visitors']].map(([n,l,s])=>`<button onclick="go('${s}')"><strong>${n}</strong><span>${l}</span></button>`).join('')}</div><div class="quick-pair" style="margin-bottom:15px"><button class="quick-card" onclick="go('wallet')"><b>◈ ${P.balance} 金币</b><small>消费钱包 · 去充值 ›</small></button><button class="quick-card video" onclick="go('earnings')"><b>我的收益</b><small>接听方收益 · 查看 ›</small></button></div><div class="menu-card">${menuRow('phone','通话记录','calls','语音 / 视频')}${menuRow('wallet','金币收支明细','bills')}${menuRow('settings','接听与收费设置','pricing','管理价格')}${menuRow('shield','实名认证','verify',P.verified?'已完成':'去认证')}</div><div class="menu-card">${menuRow('star','遇见你会员','membership')}${menuRow('calendar','每日任务','tasks')}${menuRow('edit','基本资料','edit')}${menuRow('settings','隐私与设置','settings')}</div></div>`,'mine')}
function renderModal(){document.querySelector('.sheet-mask')?.remove();if(!P.modal)return;let content='';if(P.modal==='gifts')content=`<div class="sheet-title"><h2>送给 ${currentPerson().name}</h2><button onclick="closeModal()" aria-label="关闭">×</button></div>${giftChoices()}<p>余额 ${P.balance} 金币 · ${P.call?'通话仍在继续':'礼物按标价扣费'}</p><button class="full-btn" onclick="sendGift()">赠送${gifts[P.gift].name} · ${gifts[P.gift].cost} 币</button>`;if(P.modal==='rules')content=`<div class="sheet-title"><h2>聊天收费说明</h2><button onclick="closeModal()" aria-label="关闭">×</button></div><p>私信每发送成功一条扣除 5 金币。<br>语音 60 金币/分钟，视频 120 金币/分钟。<br>接通后计费，未接通、被拒绝或取消呼叫不扣费。<br>每开始一分钟扣一次单价，不足一分钟按一分钟计费；下一分钟余额不足时结束通话。<br>礼物按面板标价单独扣费，会员权益不自动免除聊天费。</p><span class="demo-label">所有费率为方案示例，需业务确认</span>`;if(P.modal==='low')content=`<div class="sheet-title"><h2>金币余额不足</h2><button onclick="closeModal()" aria-label="关闭">×</button></div><div class="balance-low">${P.balance} <small style="font-size:13px">金币</small></div><p>本次操作需要 ${P.modalData.needed} 金币，还差 ${Math.max(0,P.modalData.needed-P.balance)} 金币。${P.call?'通话会按当前余额继续计费。':''}</p><div class="double-actions"><button onclick="closeModal()">暂不充值</button><button class="primary" onclick="go('recharge')">${P.call?'结束通话并去充值':'去充值'}</button></div>`;const el=document.createElement('div');el.className='sheet-mask';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',P.modal==='low'?'余额不足':P.modal==='gifts'?'赠送礼物':'收费说明');el.innerHTML=`<div class="sheet">${content}</div>`;document.querySelector('.phone').appendChild(el)}
function render(){const map={home:renderHome,matches:renderMatches,messages:renderMessages,mine:renderMine,detail:renderDetail,chat:renderChat,filter:renderFilter,visitors:renderVisitors,notifications:renderNotifications,tasks:renderTasks,membership:renderMembership,wallet:renderWallet,edit:renderEdit,settings:renderSettings,room:renderRoom,likes:renderLikes,callconfirm:renderCallConfirm,calling:renderCalling,voice:()=>renderLiveCall('voice'),video:()=>renderLiveCall('video'),summary:renderSummary,recharge:renderRecharge,gifts:renderGifts,bills:renderBills,calls:renderCalls,earnings:renderEarnings,pricing:renderPricing,withdraw:renderWithdraw,verify:renderVerify};document.getElementById('app').innerHTML=(map[S.screen]||renderHome)();document.getElementById('guide').innerHTML=screens.map(([s,n,i])=>`<button class="${S.screen===s?'active':''}" onclick="go('${s}',{from:'mine'})">${icon(i)}${n}</button>`).join('');renderModal()}

render();
</script>
</body>
</html>
